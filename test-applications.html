<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Applications Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    input { padding: 8px; margin: 5px; width: 200px; }
  </style>
</head>
<body>
  <h1>Applications Tracker Test</h1>

  <div class="test-section">
    <h2>Test Search Functionality</h2>
    <input type="text" id="testSearch" placeholder="Search applications...">
    <button onclick="testSearch()">Test Search</button>
    <div id="searchResult"></div>
  </div>

  <div class="test-section">
    <h2>Test Modal Functionality</h2>
    <button onclick="testModal()">Open Add Modal</button>
    <div id="modalResult"></div>
  </div>

  <div class="test-section">
    <h2>Test Data Storage</h2>
    <button onclick="testStorage()">Check Storage</button>
    <div id="storageResult"></div>
  </div>

  <script>
    // Mock Chrome API for testing
    if (typeof chrome === 'undefined') {
      window.chrome = {
        storage: {
          local: {
            get: async (keys) => {
              const data = localStorage.getItem('test_applications');
              return data ? JSON.parse(data) : {};
            },
            set: async (data) => {
              localStorage.setItem('test_applications', JSON.stringify(data));
            }
          },
          sync: {
            get: async (keys) => {
              return {}; // Mock empty settings
            }
          }
        }
      };
    }

    function testSearch() {
      const searchTerm = document.getElementById('testSearch').value;
      document.getElementById('searchResult').innerHTML = `Searching for: "${searchTerm}"`;
    }

    function testModal() {
      document.getElementById('modalResult').innerHTML = 'Modal opened (simulated)';
    }

    async function testStorage() {
      try {
        const result = await chrome.storage.local.get(['applications']);
        document.getElementById('storageResult').innerHTML = `Storage contains: ${JSON.stringify(result, null, 2)}`;
      } catch (e) {
        document.getElementById('storageResult').innerHTML = `Error: ${e.message}`;
      }
    }
  </script>
</body>
</html>
